{% extends "admin_base.html" %}

{% block title %}Record Payment - HOA Management System{% endblock %}

{% block content %}
<div class="max-w-xl mx-auto">
    <h1 class="text-2xl font-semibold text-gray-900 mb-1">Record Payment</h1>
    <p class="text-sm text-gray-500 mb-6">Digitizes a cash payment already collected in person.</p>

    {% if error %}
    <div class="mb-4 rounded-lg bg-red-50 border border-red-200 text-red-700 text-sm px-4 py-3">{{ error }}</div>
    {% endif %}

    <form method="post" action="/payments/record" class="bg-white rounded-2xl border border-gray-200 shadow-sm p-6 space-y-4">
        <div>
            <label for="homeowner_id" class="block text-sm font-medium text-gray-700 mb-1">Homeowner</label>
            <select id="homeowner_id" name="homeowner_id" required
                    class="w-full rounded-lg border border-gray-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                <option value="" disabled selected>Select homeowner</option>
                {% for h in homeowners %}
                <option value="{{ h.id }}">{{ h.full_name }}</option>
                {% endfor %}
            </select>
        </div>

        <div>
            <label for="assessment_id" class="block text-sm font-medium text-gray-700 mb-1">
                Assessment / Due (optional)
            </label>
            <select id="assessment_id" name="assessment_id"
                    class="w-full rounded-lg border border-gray-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                <option value="">None / general payment</option>
                {% for a in assessments %}
                <option value="{{ a.id }}">{{ a.description }} — ₱{{ "%.2f"|format(a.amount) }} ({{ a.status }})</option>
                {% endfor %}
            </select>
        </div>

        <div class="grid grid-cols-2 gap-4">
            <div>
                <label for="amount" class="block text-sm font-medium text-gray-700 mb-1">Amount (₱)</label>
                <input type="number" step="0.01" min="0.01" id="amount" name="amount" required
                       class="w-full rounded-lg border border-gray-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500" />
            </div>
            <div>
                <label for="payment_date" class="block text-sm font-medium text-gray-700 mb-1">Payment Date</label>
                <input type="date" id="payment_date" name="payment_date" required
                       class="w-full rounded-lg border border-gray-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500" />
            </div>
        </div>

        <div>
            <label for="payment_method" class="block text-sm font-medium text-gray-700 mb-1">Payment Method</label>
            <select id="payment_method" name="payment_method"
                    class="w-full rounded-lg border border-gray-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                <option value="cash" selected>Cash</option>
            </select>
        </div>

        <div>
            <label for="reference_number" class="block text-sm font-medium text-gray-700 mb-1">
                Receipt / Reference Number
            </label>
            <input type="text" id="reference_number" name="reference_number"
                   class="w-full rounded-lg border border-gray-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500" />
        </div>

        <div>
            <label for="notes" class="block text-sm font-medium text-gray-700 mb-1">Notes</label>
            <textarea id="notes" name="notes" rows="2"
                      class="w-full rounded-lg border border-gray-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"></textarea>
        </div>

        <button type="submit"
                class="w-full bg-blue-600 hover:bg-blue-700 text-white text-sm font-medium rounded-lg px-4 py-2.5 transition-colors">
            Record Payment
        </button>
    </form>
</div>
{% endblock %}
