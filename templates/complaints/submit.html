{% extends "admin_base.html" %}

{% block title %}Submit a Concern - HOA Management System{% endblock %}

{% block content %}
<div class="max-w-xl mx-auto">
    <a href="/complaints" class="inline-flex items-center gap-1 text-sm text-gray-500 hover:text-gray-700 mb-4">
        <i data-lucide="arrow-left" class="w-4 h-4"></i>
        Back to Concerns
    </a>
    <h1 class="text-2xl font-semibold text-gray-900 mb-1">Submit a Concern</h1>
    <p class="text-sm text-gray-500 mb-6">Let the HOA know about an issue in the village.</p>

    {% if error %}
    <div class="mb-4 rounded-lg bg-red-50 border border-red-200 text-red-700 text-sm px-4 py-3">{{ error }}</div>
    {% endif %}

    <form method="post" action="/complaints/submit" class="bg-white rounded-2xl border border-gray-200 shadow-sm p-6 space-y-4">
        <div>
            <label for="category" class="block text-sm font-medium text-gray-700 mb-1">Category</label>
            <select id="category" name="category" required
                    class="w-full rounded-lg border border-gray-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                <option value="Security">Security</option>
                <option value="Garbage">Garbage</option>
                <option value="Roads">Roads</option>
                <option value="Drainage">Drainage</option>
                <option value="Noise">Noise</option>
                <option value="Water">Water</option>
                <option value="Street Lights">Street Lights</option>
                <option value="Other">Other</option>
            </select>
        </div>

        <div>
            <label for="description" class="block text-sm font-medium text-gray-700 mb-1">Description</label>
            <textarea id="description" name="description" rows="5" required
                      placeholder="Describe the issue — location, when it started, anything relevant."
                      class="w-full rounded-lg border border-gray-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"></textarea>
        </div>

        <button type="submit"
                class="w-full bg-blue-600 hover:bg-blue-700 text-white text-sm font-medium rounded-lg px-4 py-2.5 transition-colors">
            Submit
        </button>
    </form>
</div>
{% endblock %}
