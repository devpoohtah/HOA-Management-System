{% extends "base.html" %}

{% block title %}{{ title }} - HOA Management System{% endblock %}

{% block content %}
<div class="min-h-[70vh] flex items-center justify-center px-4">
    <div class="max-w-md w-full text-center">
        <p class="text-sm font-semibold text-blue-600 mb-2">Error {{ status_code }}</p>
        <h1 class="text-2xl font-semibold text-gray-900 mb-2">{{ title }}</h1>
        <p class="text-sm text-gray-500 mb-6">{{ message }}</p>
        <a href="/"
           class="inline-flex items-center gap-2 bg-blue-600 hover:bg-blue-700 text-white text-sm font-medium rounded-lg px-4 py-2.5 transition-colors">
            <i data-lucide="home" class="w-4 h-4"></i>
            Back to Home
        </a>
    </div>
</div>
{% endblock %}
