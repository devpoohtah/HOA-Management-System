{% extends "admin_base.html" %}

{% block title %}Edit Announcement - HOA Management System{% endblock %}

{% block content %}
<div class="max-w-xl mx-auto">
    <a href="/announcements/{{ announcement.id }}" class="inline-flex items-center gap-1 text-sm text-gray-500 hover:text-gray-700 mb-4">
        <i data-lucide="arrow-left" class="w-4 h-4"></i>
        Back to Announcement
    </a>

    <h1 class="text-2xl font-semibold text-gray-900 mb-1">Edit Announcement</h1>

    {% if error %}
    <div class="mb-4 rounded-lg bg-red-50 border border-red-200 text-red-700 text-sm px-4 py-3">{{ error }}</div>
    {% endif %}

    <form method="post" action="/announcements/{{ announcement.id }}/edit" class="bg-white rounded-2xl border border-gray-200 shadow-sm p-6 space-y-4">
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Title</label>
            <input type="text" name="title" required value="{{ announcement.title }}"
                   class="w-full rounded-lg border border-gray-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Category</label>
            <select name="category" class="w-full rounded-lg border border-gray-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                {% for c in ["general", "water", "meeting", "road", "garbage", "security", "dues"] %}
                <option value="{{ c }}" {% if announcement.category == c %}selected{% endif %}>{{ c|capitalize }}</option>
                {% endfor %}
            </select>
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Content</label>
            <textarea name="content" required rows="6"
                      class="w-full rounded-lg border border-gray-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">{{ announcement.content }}</textarea>
        </div>

        <button type="submit"
                class="w-full bg-blue-600 hover:bg-blue-700 text-white text-sm font-medium rounded-lg px-4 py-2.5 transition-colors">
            Save Changes
        </button>
    </form>
</div>
{% endblock %}
