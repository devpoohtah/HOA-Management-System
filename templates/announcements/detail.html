{% extends base_template %}

{% block title %}{{ announcement.title }} - HOA Management System{% endblock %}

{% block content %}
<div class="max-w-3xl mx-auto">
    <a href="/announcements" class="inline-flex items-center gap-1 text-sm text-gray-500 hover:text-gray-700 mb-4">
        <i data-lucide="arrow-left" class="w-4 h-4"></i>
        Back to Announcements
    </a>

    <div class="bg-white rounded-2xl border border-gray-200 shadow-sm p-6">
        <div class="flex items-center justify-between mb-3">
            <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-blue-100 text-blue-700 capitalize">
                {{ announcement.category }}
            </span>
            <span class="text-xs text-gray-400">{{ announcement.created_at or "" }}</span>
        </div>

        <h1 class="text-xl font-semibold text-gray-900 mb-4">{{ announcement.title }}</h1>

        <p class="text-sm text-gray-700 whitespace-pre-line">{{ announcement.content }}</p>
    </div>
</div>
{% endblock %}
