{% extends "admin_base.html" %}

{% block title %}New Request - HOA Management System{% endblock %}

{% block content %}
<div class="max-w-xl mx-auto">
    <a href="/requests" class="inline-flex items-center gap-1 text-sm text-gray-500 hover:text-gray-700 mb-4">
        <i data-lucide="arrow-left" class="w-4 h-4"></i>
        Back to Requests
    </a>
    <h1 class="text-2xl font-semibold text-gray-900 mb-1">New Request</h1>
    <p class="text-sm text-gray-500 mb-6">Request a certificate, clearance, gate pass, or facility reservation.</p>

    {% if error %}
    <div class="mb-4 rounded-lg bg-red-50 border border-red-200 text-red-700 text-sm px-4 py-3">{{ error }}</div>
    {% endif %}

    <form method="post" action="/requests/submit" class="bg-white rounded-2xl border border-gray-200 shadow-sm p-6 space-y-4">
        <div>
            <label for="request_type" class="block text-sm font-medium text-gray-700 mb-1">Request Type</label>
            <select id="request_type" name="request_type" required
                    class="w-full rounded-lg border border-gray-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                <option value="Certificate">Certificate</option>
                <option value="Clearance">Clearance</option>
                <option value="Gate Pass">Gate Pass</option>
                <option value="Facility Reservation">Facility Reservation</option>
                <option value="Other">Other</option>
            </select>
        </div>

        <div>
            <label for="description" class="block text-sm font-medium text-gray-700 mb-1">Details</label>
            <textarea id="description" name="description" rows="5" required
                      placeholder="Describe what you need — purpose, dates, or other relevant details."
                      class="w-full rounded-lg border border-gray-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"></textarea>
        </div>

        <button type="submit"
                class="w-full bg-blue-600 hover:bg-blue-700 text-white text-sm font-medium rounded-lg px-4 py-2.5 transition-colors">
            Submit Request
        </button>
    </form>
</div>
{% endblock %}
