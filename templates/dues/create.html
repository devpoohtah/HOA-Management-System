{% extends "admin_base.html" %}

{% block title %}New Assessment - HOA Management System{% endblock %}

{% block content %}
<div class="max-w-xl mx-auto">
    <a href="/dues" class="inline-flex items-center gap-1 text-sm text-gray-500 hover:text-gray-700 mb-4">
        <i data-lucide="arrow-left" class="w-4 h-4"></i>
        Back to Dues
    </a>
    <h1 class="text-2xl font-semibold text-gray-900 mb-1">New Due / Assessment</h1>
    <p class="text-sm text-gray-500 mb-6">Generate a monthly due or special assessment for a homeowner.</p>

    {% if error %}
    <div class="mb-4 rounded-lg bg-red-50 border border-red-200 text-red-700 text-sm px-4 py-3">{{ error }}</div>
    {% endif %}

    <form method="post" action="/dues/new" class="bg-white rounded-2xl border border-gray-200 shadow-sm p-6 space-y-4">
        <div>
            <label for="homeowner_id" class="block text-sm font-medium text-gray-700 mb-1">Homeowner</label>
            <select id="homeowner_id" name="homeowner_id" required
                    class="w-full rounded-lg border border-gray-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                <option value="" disabled selected>Select homeowner</option>
                {% for h in homeowners %}
                <option value="{{ h.id }}">{{ h.full_name }}</option>
                {% endfor %}
            </select>
        </div>

        <div>
            <label for="assessment_type" class="block text-sm font-medium text-gray-700 mb-1">Type</label>
            <select id="assessment_type" name="assessment_type"
                    class="w-full rounded-lg border border-gray-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                <option value="regular" selected>Regular Monthly Due</option>
                <option value="special">Special Assessment</option>
            </select>
        </div>

        <div>
            <label for="description" class="block text-sm font-medium text-gray-700 mb-1">Description</label>
            <input type="text" id="description" name="description" required
                   placeholder="e.g. Monthly HOA Due, Perimeter Fence Special Assessment"
                   class="w-full rounded-lg border border-gray-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500" />
        </div>

        <div class="grid grid-cols-2 gap-4">
            <div>
                <label for="amount" class="block text-sm font-medium text-gray-700 mb-1">Amount (₱)</label>
                <input type="number" step="0.01" min="0.01" id="amount" name="amount" required
                       class="w-full rounded-lg border border-gray-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500" />
            </div>
            <div>
                <label for="due_date" class="block text-sm font-medium text-gray-700 mb-1">Due Date</label>
                <input type="date" id="due_date" name="due_date"
                       class="w-full rounded-lg border border-gray-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500" />
            </div>
        </div>

        <div>
            <label for="period_label" class="block text-sm font-medium text-gray-700 mb-1">
                Period (optional)
            </label>
            <input type="text" id="period_label" name="period_label" placeholder="e.g. October 2026"
                   class="w-full rounded-lg border border-gray-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500" />
        </div>

        <button type="submit"
                class="w-full bg-blue-600 hover:bg-blue-700 text-white text-sm font-medium rounded-lg px-4 py-2.5 transition-colors">
            Create Assessment
        </button>
    </form>
</div>
{% endblock %}
